# Publishes the site to GitHub Pages.
#
# There is no build step — the site is static HTML, CSS and JS — so this only
# uploads the directory and tells Pages to serve it. If you move the site into a
# subdirectory (a common choice is `docs/`), change `path:` below to match.
#
# No manual setup is required: `enablement: true` on the Configure Pages step
# below creates the Pages site on first run. If that ever fails (an org can
# forbid it), do it by hand instead: Settings → Pages → Build and deployment →
# Source → "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` so a queued deploy
# finishes rather than being dropped — the last push should always win, but only
# after the one already publishing has landed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet, instead of failing
          # with "Get Pages site failed … Error: Not Found". Without this the
          # very first run of a fresh repository always fails, and the error
          # names an API 404 rather than the missing setting that caused it.
          # Needs the `pages: write` permission granted above.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site root. Change to './docs' if you nest it.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
